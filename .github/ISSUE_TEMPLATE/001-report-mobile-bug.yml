name: Report Mobile Bug
description: Report a GTNH Mobile bug that does not close the game or prevent it from starting.
labels:
  - "Status: Triage"
  - "Mobile"
  - "Bug: Minor"

body:
  - type: markdown
    attributes:
      value: |
        Please read the [GTNH Mobile README](https://github.com/GTNewHorizons/Mobile-Issues-Tracker/blob/master/README.md), including supported configurations and required mobile settings, before submitting.

        Use this form for mobile-only gameplay, rendering, or input problems. If the game closes unexpectedly or fails to start, use **Report Mobile Crash**. For improvements rather than broken behavior, use **Suggest a Mobile Change**. If the same problem occurs on desktop, report it in the [main GTNH issue tracker](https://github.com/GTNewHorizons/GT-New-Horizons-Modpack/issues) instead.

  - type: input
    id: discord
    attributes:
      label: Your GTNH Discord Username
      description: "Leave empty if you don't have one, but this makes it easier to contact you if clarification is needed."
      placeholder: "Example: Fake"

  - type: input
    id: version
    attributes:
      label: Your Pack Version
      description: "Enter the exact GTNH version shown on the main menu, including any beta or dev suffix. Neither \"latest\" nor \"1.7.10\" is a valid pack version."
      placeholder: "Example: 2.9.0-beta-2"
    validations:
      required: true

  - type: input
    id: launcher
    attributes:
      label: Amethyst Launcher Version
      description: "Enter the exact version of the Amethyst launcher you downloaded. Do not enter \"latest\"."
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device Model and Android Version
      description: "Include your phone or tablet model and the Android version it is running."
      placeholder: "Example: Google Pixel 8, Android 14"
    validations:
      required: true

  - type: input
    id: memory
    attributes:
      label: Allocated Memory
      description: "Enter the memory allocated to the game in Amethyst, including units. This is not your device's total RAM."
      placeholder: "Example: 4 GB"
    validations:
      required: true

  - type: input
    id: server
    attributes:
      label: Your Server or Play Mode
      description: "Enter SP for single-player, Open to LAN, or the server name and type if known. Do not include private server addresses."
      placeholder: "Example: SP, private Forge server"
    validations:
      required: true

  - type: textarea
    id: expectation
    attributes:
      label: Your Expectation
      description: "What were you trying to do, and what did you expect to happen?"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: The Reality
      description: "What happened instead? Include any error message and attach screenshots or a video if helpful. For input problems, say whether you use touch controls, a controller, or a keyboard and mouse."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Attach `logs/fml-client-latest.log` from the affected instance, or paste a link to it. If no log is generated, say so and explain what you checked. Remove passwords, tokens, or other private information before uploading."
      placeholder: "Drag and drop files here, or paste links to uploaded logs."
    validations:
      required: false

  - type: checkboxes
    id: final
    attributes:
      label: Final Checklist
      description: Please confirm the following so we can better handle this report.
      options:
        - label: "I have read the GTNH Mobile README and am using a supported configuration, with the required mobile-specific settings intact."
          required: true
        - label: "I can only reproduce this problem on the mobile version of GTNH."
          required: true
        - label: "I have searched this tracker and the main GTNH issue tracker, including closed issues, and found no similar report."
          required: true
        - label: "Other players have confirmed the same problem on a supported mobile configuration."
          required: false
